[package]
name = "gori-core"
version = "0.1.0"
edition = "2021"
publish = false
license = "AGPL-3.0-only"
description = "Krypton Ø on-device crypto core"

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
x25519-dalek = { version = "2", default-features = false, features = ["static_secrets", "zeroize"] }
ed25519-dalek = { version = "2", default-features = false, features = ["std", "zeroize"] }
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
hkdf = "0.12"
sha2 = { version = "0.10", default-features = false }
zeroize = { version = "1", features = ["derive"] }
rand_core = { version = "0.6", features = ["getrandom"] }
hex = "0.4"
# Public-key validation (strict Ed25519 and X25519: canonical encoding, small order, torsion). Same version that
# ed25519-dalek and x25519-dalek already use.
curve25519-dalek = { version = "4", default-features = false }
# Anonymous invite tickets (RFC 9497 VOPRF, ristretto255-SHA512), src/oprf.rs and src/ticket.rs. Pinned (=): an
# upgrade means re-running the test vectors and review.
# `danger` is enabled for the deterministic blind (VoprfClient::deterministic_blind_unchecked), because the blind is
# derived from the account key seed (ticket.rs). The feature also exposes derive_key, get_blind and fixed POPRF
# evaluation, but the core uses only that one entry point
# (tests/oprf.rs::danger_feature_is_used_only_for_deterministic_blind scans the sources token by token to enforce this).
voprf = { version = "=0.5.0", default-features = false, features = ["ristretto255-ciphersuite", "alloc", "danger"] }
# Ticket derivation formulas (ticket.rs: HMAC-SHA256, HMAC-SHA512). Same version that hkdf already pulls in.
hmac = { version = "0.12", default-features = false }
# Hybrid post-quantum sealing and identity keys (src/pq.rs). RustCrypto pure-Rust implementations, used in a hybrid
# construction (X25519 and Ed25519 remain) and checked against NIST ACVP and X-Wing draft 06 vectors. Pinned (=):
# an upgrade means re-running the vectors and review. `alloc` keeps the large key structures on the heap (Box);
# `zeroize` wipes secrets (ML-KEM decapsulation key, ML-DSA signing key) on drop (tests/zeroize.rs). Default
# features (getrandom, pkcs8) are off: randomness comes from the core's own RNG.
ml-kem = { version = "=0.3.3", default-features = false, features = ["alloc", "zeroize"] }
ml-dsa = { version = "=0.1.1", default-features = false, features = ["alloc", "zeroize"] }
# SHA3-256 (X-Wing combiner, dh) and SHAKE256 (seed expansion). Same versions ml-kem and ml-dsa already pull in,
# so the binary carries one copy.
sha3 = { version = "=0.12.0", default-features = false, features = ["zeroize"] }
shake = { version = "=0.1.0", default-features = false, features = ["zeroize"] }
# Constant-time comparison of ticket outputs (oprf::ServerKey::verify_output). Same version curve25519-dalek uses.
subtle = { version = "2.6", default-features = false }
# PIN hash (scrypt N=2^14, r=8, p=1, 32 bytes), computed natively. The output must match the JavaScript
# implementation (@noble/hashes) byte for byte; tests/scrypt.rs checks RFC 7914 vectors and @noble outputs.
# Pinned (=): an upgrade means re-running the vectors. 0.11 reuses the hmac 0.12 and sha2 0.10 already in the
# tree. Default features (simple: PHC strings and password-hash, std) are off; only scrypt::scrypt is used.
scrypt = { version = "=0.11.0", default-features = false }

# Android JNI boundary (src/jni.rs), built as a cdylib (.so) for Android targets
[target.'cfg(target_os = "android")'.dependencies]
jni = { version = "0.21", default-features = false }

[features]
# Server-side VOPRF (key derivation, blind evaluation, proofs, checking a spent ticket: oprf::ServerKey). Not part
# of the app library build (--lib). Tests enable it through the self dev-dependency below, so `cargo test` alone
# also exercises the server operations.
test-server = []

[dev-dependencies]
gori-core = { path = ".", features = ["test-server"] }
rand_chacha = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
# Cross-check only (tests/pq.rs): with the same seeds and randomness, our X-Wing construction (src/pq.rs) must give
# the same public key, ciphertext and shared secret. Pulls in x25519-dalek 3, but only into the test binaries.
x-wing = { version = "=0.1.1", default-features = false }

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
debug = false
strip = "debuginfo"
panic = "unwind"
